<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Divya Ravishankar | Portfolio</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
      color:white;
    }

    .card{
      width:370px;
      padding:45px;
      border-radius:22px;
      background:rgba(255,255,255,0.06);
      backdrop-filter:blur(12px);
      text-align:center;
      box-shadow:0 8px 30px rgba(0,0,0,0.3);
    }

    h1{
      font-size:40px;
      margin-bottom:10px;
    }

    .role{
      color:#38bdf8;
      margin-bottom:20px;
      font-size:18px;
    }

    p{
      color:#cbd5e1;
      line-height:1.7;
      margin-bottom:30px;
      font-size:15px;
    }

    a{
      text-decoration:none;
      background:#38bdf8;
      color:#0f172a;
      padding:13px 30px;
      border-radius:12px;
      font-weight:bold;
      transition:0.3s;
      display:inline-block;
    }

    a:hover{
      transform:scale(1.06);
      background:white;
    }

  </style>
</head>

<body>

  <div class="card">

    <h1>Divya Ravishankar</h1>

    <div class="role">
      Aspiring Full Stack Developer
    </div>

    <p>
      Passionate about web development, AI,
      and creating innovative digital solutions.
      Currently learning and building projects
      to grow as a software developer.
    </p>

    <a href="https://github.com/Divya1234532" target="_blank">
      View My Portfolio →
    </a>

  </div>

</body>
</html>
